<div class="content">
  <mat-card>
    <mat-card-content>
      <mat-card>
        <mat-card-content>
          <form [formGroup]="formGroup">
            <mat-form-field>
              <mat-label>ID</mat-label>
              <input type="text" matInput placeholder="ID000001" formControlName="userUniqueID" maxLength='20' required>
              <mat-error *ngIf="formGroup.get('userUniqueID').hasError('required')">{{msg.noenteredErr.replace('※1','ID')}}</mat-error>
              <mat-error *ngIf="formGroup.get('userUniqueID').hasError('pattern')">{{msg.idFormChkErr}}</mat-error>
              <mat-hint>{{msg.idFormChkErr}}</mat-hint>
            </mat-form-field>
          </form>
          <button id="search-button" class="focus-button" mat-raised-button color="primary" type="button" (click)="onSearch()" [disabled]="formGroup.invalid">検索</button>
        </mat-card-content>
      </mat-card>
      <ng-container *ngIf="user">
        <mat-card>
          <mat-card-content class="user">
            <app-image-panel [imageInfo]="user.userImage">
              <div class="nickName">{{user.nickname}}</div>
              <button mat-raised-button class="inviteButton focus-button" color="primary" type="button" (click)="inviteStaff(user)" [disabled]="isInvited(user) || belongToOrgan(user)">
                <ng-container *ngIf="belongToOrgan(user)">参加済み</ng-container>
                <ng-container *ngIf="!belongToOrgan(user)" [ngSwitch]="isInvited(user)">
                  <ng-container *ngSwitchCase="false">招待する</ng-container>
                  <ng-container *ngSwitchCase="true">招待済み</ng-container>
                </ng-container>
              </button>
            </app-image-panel>
          </mat-card-content>
        </mat-card>
      </ng-container>
      <button class="focus-button" data-test="pageBackBtn" mat-raised-button color="primary" type="button" (click)="onClickBack()">戻る</button>
    </mat-card-content>
  </mat-card>
</div>
