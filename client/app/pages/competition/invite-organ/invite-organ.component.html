<div class="content">
  <mat-card>
    <mat-card-content>
      <mat-card>
        <mat-card-content>

          <form [formGroup]="formGroup">
            <mat-form-field >
              <mat-label>競技</mat-label>
              <input type="text" matInput [value]="formGroup.get('sports').value | getSportValue" readonly required>
              <input type="hidden" formControlName="sports">
            </mat-form-field>
            <mat-form-field>
              <mat-label>主催団体名</mat-label>
              <input type="text" matInput placeholder="団体名又はチーム名" formControlName="organName" required>
              <mat-error *ngIf="formGroup.get('organName').hasError('required')">{{msg.noenteredErr.replace('※1','主催団体名')}}</mat-error>
            </mat-form-field>
          </form>
          <button mat-raised-button color="primary" type="button" (click)="onSearch()" [disabled]="formGroup.invalid">検索</button>

        </mat-card-content>
      </mat-card>

      <mat-card>
        <mat-card-header>
          <mat-card-title>団体</mat-card-title>
        </mat-card-header>
        <mat-card-content class="organ-List">
          <ng-container *ngFor="let organ of organList">
            <app-image-panel [imageInfo]="organ.organLogo">
              <div>{{organ.organName}}</div>
              <div>{{organ.organAddInf.organPrefecture + organ.organAddInf.organCity}}</div>
              <ng-container *ngIf="isInvited(organ)">
                <button mat-raised-button color="primary" type="button" disabled>招待済み</button>
              </ng-container>
              <ng-container *ngIf="!isInvited(organ)">
                <button mat-raised-button color="primary" type="button" (click)="inviteOrgan(organ)">招待</button>
              </ng-container>
            </app-image-panel>
          </ng-container>
        </mat-card-content>
      </mat-card>

      <mat-card>
        <mat-card-header>
          <mat-card-title>チーム</mat-card-title>
        </mat-card-header>
        <mat-card-content class="organ-List">
          <ng-container *ngFor="let team of teamList">
            <app-image-panel [imageInfo]="team.teamLogo">
              <div>{{team.teamName}}</div>
              <div>{{team.teamAddInf.teamPrefecture + team.teamAddInf.teamCity}}</div>
              <ng-container *ngIf="isInvited(team)">
                <button mat-raised-button color="primary" type="button" disabled>招待済み</button>
              </ng-container>
              <ng-container *ngIf="!isInvited(team)">
                <button mat-raised-button color="primary" type="button" (click)="inviteOrgan(team)">招待</button>
              </ng-container>
            </app-image-panel>
          </ng-container>
        </mat-card-content>
      </mat-card>

      <div class="footer-button-area">
        <button mat-raised-button color="primary" type="button" (click)="returnManageCompetition()">戻る</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
