<div class="content">
  <mat-card>
    <mat-card-content>

      <mat-card>
        <mat-card-content>
          <form [formGroup]="formGroup">
            <mat-form-field >
              <mat-label>競技</mat-label>
              <input type="text" matInput [value]="formGroup.get('sports').value | getSportValue" readonly required>
              <input type="hidden" formControlName="sports">
            </mat-form-field>
            <mat-form-field>
              <mat-label>都道府県</mat-label>
              <mat-select formControlName="teamPrefecture" required>
                <mat-option *ngFor="let prefecture of prefectures" value="{{prefecture}}">{{prefecture}}</mat-option>
              </mat-select>
              <mat-error *ngIf="formGroup.get('teamPrefecture').hasError('required')">{{msg.unselectErr.replace('※1','都道府県')}}</mat-error>
            </mat-form-field>
            <mat-form-field>
              <mat-label>チーム名</mat-label>
              <input type="text" matInput formControlName="teamName">
            </mat-form-field>
            <div class="checkbox-area">
              <input type="checkbox" value="1" formControlName="searchType">
              <span>以前選択したチームのみ対象</span>
            </div>
          </form>
          <button mat-raised-button color="primary" type="button" (click)="onSearch()" [disabled]="formGroup.invalid">検索</button>
        </mat-card-content>
      </mat-card>

      <mat-table [dataSource]="teamInfoList">
        <ng-container matColumnDef="invite">
          <mat-header-cell *matHeaderCellDef></mat-header-cell>
          <mat-cell *matCellDef="let row">
            <ng-container *ngIf="isInvited(row)">
              <button mat-raised-button color="primary" type="button" disabled>招待済み</button>
            </ng-container>
            <ng-container *ngIf="!isInvited(row)">
              <button mat-raised-button color="primary" type="button" (click)="inviteTeam(row)">招待</button>
            </ng-container>
          </mat-cell>
        </ng-container>
        <ng-container matColumnDef="teamName">
          <mat-header-cell *matHeaderCellDef>チーム名</mat-header-cell>
          <mat-cell *matCellDef="let row"> {{row.teamName}} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="teamAddress">
          <mat-header-cell *matHeaderCellDef>所在地</mat-header-cell>
          <mat-cell *matCellDef="let row">{{row.teamAddress}}</mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="['invite', 'teamName','teamAddress']"></mat-header-row>
        <mat-row *matRowDef="let row; columns: ['invite', 'teamName', 'teamAddress']"></mat-row>
      </mat-table>

      <div class="footer-button-area">
        <button mat-raised-button color="primary" type="button" (click)="returnManageCompetition()">戻る</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
