<div class="content">
  <mat-card>
    <mat-card-content>
      <mat-card>
        <mat-card-content>

          <form [formGroup]="formGroup">
            <mat-form-field >
              <mat-label>競技</mat-label>
              <input type="text" matInput [value]="formGroup.get('sports').value | getSportValue" readonly required>
              <input type="hidden" formControlName="sports">
            </mat-form-field>
            <mat-form-field>
              <mat-label>ID</mat-label>
              <input type="text" matInput placeholder="ID000001" formControlName="userId">
            </mat-form-field>
            <mat-form-field>
              <mat-label>主催団体名</mat-label>
              <mat-select formControlName="organInfo" >
                <mat-option value=""></mat-option>
                <mat-option *ngFor="let organ of organizerList" [value]="organ">{{organ.organName}}</mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field>
              <mat-label>ニックネーム</mat-label>
              <input type="text" matInput placeholder="山田 太郎" formControlName="name">
            </mat-form-field>
          </form>
          <button mat-raised-button color="primary" type="button" (click)="onSearch()">検索</button>
        </mat-card-content>
      </mat-card>

      <form [formGroup]="form">
        <mat-card>
          <table>
            <thead>
              <td></td>
              <td>主催者団体</td>
              <td>ニックネーム</td>
            </thead>
            <tbody>
              <ng-container formArrayName="member" *ngFor="let index of getMember.controls; index as i">
                <ng-container [formGroupName]="i" class="table-data">
                  <tr>
                    <td>
                      <ng-container *ngIf="isInvited(i)">
                        <button mat-raised-button color="primary" type="button" disabled>招待済み</button>
                      </ng-container>
                      <ng-container *ngIf="!isInvited(i)">
                        <button mat-raised-button color="primary" type="button" (click)="inviteMember(i)">招待</button>
                      </ng-container>
                    </td>
                    <td>
                      <textarea cdkTextareaAutosize matInput formControlName="organizerNames" readonly></textarea>
                    </td>
                    <td>
                      <input matInput formControlName="name" readonly>
                    </td>
                  </tr>
                </ng-container>
              </ng-container>
            </tbody>
          </table>
          <div class="footer-button-area">
            <button mat-raised-button color="primary" type="button" (click)="returnManageCompetition()">戻る</button>
          </div>
        </mat-card>
      </form>
    </mat-card-content>
  </mat-card>
</div>
