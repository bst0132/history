<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>{{data.message}}</mat-dialog-content>
<mat-dialog-actions>
  <ng-container *ngIf="data.mode == 'confirm'">
    <button mat-button type="button" [mat-dialog-close]="true">OK</button>
    <button mat-button type="button" [mat-dialog-close]="false">キャンセル</button>
  </ng-container>
  <ng-container *ngIf="data.mode == 'notice'">
    <button mat-button type="button" [mat-dialog-close]="true">OK</button>
  </ng-container>
</mat-dialog-actions>
